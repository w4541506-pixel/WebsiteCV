<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Will MacDonald — Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">

<!-- ============================================================
     HOW TO USE THIS FILE
     1. Edit the SITE block below (name, tagline, links).
     2. Drop photos / videos into the media/ folder, e.g. media/robot-arm/front.jpg
     3. Add a project to the PROJECTS list. Copy the example and change the text.
        media types:
          { type: "image", src: "media/robot-arm/front.jpg", caption: "optional" }
          { type: "video", src: "media/robot-arm/demo.mp4" }         (mp4 works best)
          { type: "youtube", id: "dQw4w9WgXcQ" }                      (the bit after v= in the URL)
     4. Open index.html in a browser to check. Push to GitHub Pages to publish.
     Nothing else needs touching.
     ============================================================ -->
<script>
const SITE = {
  name: "Will MacDonald",
  fullName: "William Te Ata O Tū MacDonald",
  tagline: "Second-year Mechatronics Engineering student at the University of Canterbury.",
  location: "Christchurch, New Zealand",
  links: [
    { label: "will.teataotu@outlook.co.nz", href: "mailto:will.teataotu@outlook.co.nz" },
    { label: "LinkedIn", href: "https://linkedin.com/in/will-macdonald-016420419" }   // put your real GitHub here                // drop your CV next to this file as cv.pdf
  ],
  skills: [
    "Fabrication, lathing, milling, CAD and G-code."
  ]
};

const PROJECTS = [
  {
    title: "Line following robot PCB Design",
    year: "2026",
    context: "ENMT221 · University of Canterbury",   // course, club, personal, work
    role: "Solo",                                     // Solo / Pair / Team of 4 (my part: firmware)
    summary: "Tasked with creating a PCB design with capability for a line following robot, alongside a motion transmission system",
    details: [
      "Designed an ATmega328-based controller PCB (KiCad, DRC-clean, fabrication-ready) and a 15:1 two-stage spur gearbox for a line-following robot, including motor performance analysis showing the design was traction-limited rather than torque-limited."
    ],
    tags: ["Kicad", "CAD"],
    media: [
      { type: "image", src: "media/example/photo1.jpg", caption: "Front view of the finished build" },
      { type: "image", src: "media/example/photo2.jpg", caption: "Inside the enclosure" },
      { type: "video", src: "media/example/demo.mp4" },
      { type: "youtube", id: "" }   // paste a YouTube id, or delete this line
    ],  
  }
];
</script>

<style>
:root{
  --bg:#EDEEEA;
  --paper:#F7F7F4;
  --ink:#151A1E;
  --ink-2:#4B535B;
  --rule:#C9CCC6;
  --blue:#1E48C8;
  --blue-deep:#12308E;
  --font:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;font-size:17px;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover,a:focus-visible{color:var(--blue-deep);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}

/* ---------- header: engineering title block ---------- */
header{border-bottom:2px solid var(--ink);padding:36px 0 28px}
.tb{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.tb h1{font-variation-settings:"wdth" 110;font-weight:800;font-size:clamp(44px,8vw,104px);line-height:.92;letter-spacing:-.02em}
.tb .full{color:var(--ink-2);font-size:15px;margin-top:10px}
.tb .stamp{border:2px solid var(--ink);padding:10px 14px;font-size:13px;line-height:1.35;color:var(--ink);min-width:200px}
.tb .stamp b{display:block;font-weight:700}
.tb .stamp span{display:block;color:var(--ink-2)}
.tagline{max-width:62ch;font-size:clamp(19px,2.4vw,24px);font-weight:500;line-height:1.35;margin-top:36px;letter-spacing:-.005em}
.links{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:22px;font-size:15px;font-weight:500}
.links a{border-bottom:1.5px solid var(--blue)}
.links a:hover{text-decoration:none;border-color:var(--blue-deep)}
.skills{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.skills span{font-size:13.5px;font-weight:500;border:1px solid var(--rule);background:var(--paper);padding:5px 10px;border-radius:3px;color:var(--ink-2)}

/* ---------- projects ---------- */
.projects-head{display:flex;align-items:baseline;justify-content:space-between;padding:44px 0 12px;border-bottom:1px solid var(--rule)}
.projects-head h2{font-size:15px;font-weight:600;color:var(--ink-2)}
.projects-head small{font-size:13px;color:var(--ink-2)}

.project{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);padding:44px 0;border-bottom:1px solid var(--rule)}
.project:last-child{border-bottom:none}
.p-meta{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.p-meta span+span::before{content:"/";margin-right:14px;color:var(--rule)}
.project h3{font-variation-settings:"wdth" 105;font-weight:700;font-size:clamp(26px,3vw,34px);line-height:1.1;letter-spacing:-.015em;margin:10px 0 14px}
.p-summary{font-size:17px}
.p-details{margin:16px 0 0 0;padding-left:18px;font-size:15.5px;color:var(--ink);display:grid;gap:6px}
.p-details li::marker{color:var(--blue)}
.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.p-tags span{font-size:12.5px;font-weight:600;color:var(--blue-deep);background:#E1E7FA;padding:3px 8px;border-radius:3px}
.p-link{display:inline-block;margin-top:18px;font-weight:600;font-size:15px}

/* gallery */
.gallery{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);align-content:start}
.gallery figure{margin:0;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.gallery figure.wide{grid-column:1/-1}
.gallery img,.gallery video,.gallery iframe{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#DEE0DB}
.gallery figure.wide img,.gallery figure.wide video,.gallery figure.wide iframe{aspect-ratio:16/9}
.gallery iframe{border:0}
.gallery img{cursor:zoom-in}
.gallery figcaption{font-size:13px;color:var(--ink-2);padding:8px 10px;border-top:1px solid var(--rule)}
.gallery .missing{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:16px;font-size:13px;color:var(--ink-2);background:repeating-linear-gradient(45deg,#E4E6E1 0 8px,#ECEEE9 8px 16px)}
.gallery .missing code{font-family:inherit;font-weight:600;color:var(--ink)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(21,26,30,.94);display:none;place-items:center;z-index:50;padding:24px}
.lb.open{display:grid}
.lb img{max-width:min(96vw,1400px);max-height:88vh;object-fit:contain}
.lb figcaption{color:#C9CCC6;font-size:14px;text-align:center;margin-top:12px}
.lb button{position:absolute;top:16px;right:20px;background:none;border:0;color:#fff;font:600 15px var(--font);cursor:pointer;padding:8px}

footer{padding:36px 0 48px;font-size:13.5px;color:var(--ink-2);border-top:2px solid var(--ink);margin-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:820px){
  .tb{grid-template-columns:1fr}
  .tb .stamp{display:none}
  .project{grid-template-columns:1fr;gap:22px;padding:36px 0}
  body{font-size:16px}
}
@media (max-width:480px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="tb">
      <div>
        <h1 id="name"></h1>
        <div class="full" id="fullname"></div>
      </div>
      <div class="stamp">
        <b>Engineering portfolio</b>
        <span id="stamp-loc"></span>
        <span id="stamp-date"></span>
      </div>
    </div>
    <p class="tagline" id="tagline"></p>
    <nav class="links" id="links" aria-label="Contact"></nav>
    <div class="skills" id="skills"></div>
  </div>
</header>

<main class="wrap">
  <div class="projects-head">
    <h2>Projects</h2>
    <small id="count"></small>
  </div>
  <div id="projects"></div>
</main>

<footer class="wrap">
  <span id="foot-name"></span>
  <span>Built by hand, no framework</span>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" id="lb-close">Close (Esc)</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// header
$("name").textContent = SITE.name;
$("fullname").textContent = SITE.fullName;
$("tagline").textContent = SITE.tagline;
$("stamp-loc").textContent = SITE.location;
$("stamp-date").textContent = "Updated " + new Date(document.lastModified).toLocaleDateString("en-NZ",{month:"short",year:"numeric"});
$("foot-name").textContent = "© " + new Date().getFullYear() + " " + SITE.fullName;
$("links").innerHTML = SITE.links.filter(l => l.href).map(l =>
  `<a href="${esc(l.href)}" ${l.href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>${esc(l.label)}</a>`).join("");
$("skills").innerHTML = (SITE.skills || []).map(s => `<span>${esc(s)}</span>`).join("");

// media
function mediaHTML(m, i, total) {
  const wide = total === 1 || (m.type !== "image");
  const cls = wide ? ' class="wide"' : "";
  const cap = m.caption ? `<figcaption>${esc(m.caption)}</figcaption>` : "";
  if (m.type === "image") {
    return `<figure${cls}><img src="${esc(m.src)}" alt="${esc(m.caption || "Project photo")}" loading="lazy"
      data-cap="${esc(m.caption || "")}" onerror="this.outerHTML='<div class=missing><span>Add image at<br><code>${esc(m.src)}</code></span></div>'">${cap}</figure>`;
  }
  if (m.type === "video") {
    return `<figure${cls}><video controls preload="metadata" playsinline src="${esc(m.src)}"
      onerror="this.outerHTML='<div class=missing><span>Add video at<br><code>${esc(m.src)}</code></span></div>'"></video>${cap}</figure>`;
  }
  if (m.type === "youtube" && m.id) {
    return `<figure${cls}><iframe src="https://www.youtube-nocookie.com/embed/${esc(m.id)}" title="Video" loading="lazy"
      allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe>${cap}</figure>`;
  }
  return "";
}

// projects
const shown = PROJECTS.filter(p => p.title);
$("count").textContent = shown.length + (shown.length === 1 ? " project" : " projects");
$("projects").innerHTML = shown.map(p => {
  const media = (p.media || []).filter(m => m && (m.src || m.id));
  const meta = [p.year, p.context, p.role].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("");
  return `
  <article class="project">
    <div>
      <div class="p-meta">${meta}</div>
      <h3>${esc(p.title)}</h3>
      <p class="p-summary">${esc(p.summary)}</p>
      ${p.details?.length ? `<ul class="p-details">${p.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
      ${p.tags?.length ? `<div class="p-tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
      ${p.link?.href ? `<a class="p-link" href="${esc(p.link.href)}" target="_blank" rel="noopener">${esc(p.link.label || "Link")}</a>` : ""}
    </div>
    <div class="gallery">${media.map((m, i) => mediaHTML(m, i, media.length)).join("")}</div>
  </article>`;
}).join("") || `<p style="padding:40px 0;color:var(--ink-2)">No projects yet. Add one to the PROJECTS list at the top of index.html.</p>`;

// lightbox
const lb = $("lb"), lbImg = $("lb-img"), lbCap = $("lb-cap");
document.addEventListener("click", e => {
  const img = e.target.closest(".gallery img");
  if (img) { lbImg.src = img.src; lbImg.alt = img.alt; lbCap.textContent = img.dataset.cap || ""; lb.classList.add("open"); $("lb-close").focus(); }
  else if (e.target === lb || e.target === $("lb-close")) lb.classList.remove("open");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open"); });
</script>
</body>
</html>
